<!DOCTYPE html>
<html>
<head>
<title>Search for a Value</title>
</head>
<body>

    <h1>Search for a Value</h1>
    <p>Array: 10, 20, 30, 40, 50</p>

    <label>Enter a value to search:</label>
    <input type="number" id="searchValue">
    <button onclick="searchValue()">Search</button>
    <p id="result"></p>

    <script>
        let numbers = [10, 20, 30, 40, 50];
        function searchValue() {
            let value = Number(document.getElementById("searchValue").value);
            let found = false;
            for (let i = 0; i < numbers.length; i++) {
                if (numbers[i] === value) {
                    document.getElementById("result").innerHTML = "Value found at index " + i;
                    found = true;
                    break;
                }
            }
            if (found === false) {
                document.getElementById("result").innerHTML = "Value does not exist in the array.";
            }
        }
</script>
</body>
</html>
